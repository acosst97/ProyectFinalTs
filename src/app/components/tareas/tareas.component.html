
<div class="contenido-modal">
  <app-modal #AbriModal id="form-main">
    <div class="cont">
     <div class="form-card">
       <h2>{{ editando ? 'Editar Tarea' : 'Crear Nueva Tarea' }}</h2>
       <form [formGroup]="tareaForm" (ngSubmit)="guardarTarea()">
         <div class="form-group">
           <label for="titulo">Título:</label>
           <input type="text" id="titulo" formControlName="titulo" required>
         </div>
   
         <div class="form-group">
           <label for="descripcion">Descripción:</label>
           <textarea id="descripcion" formControlName="descripcion"></textarea>
         </div>
   
         <div class="form-group">
           <label for="prioridad">Prioridad:</label>
           <select id="prioridad" formControlName="prioridad">
             <option value="alta">Alta</option>
             <option value="media">Media</option>
             <option value="baja">Baja</option>
           </select>
         </div>
   
         <div class="form-group">
           <label for="fechaVencimiento">Fecha de vencimiento:</label>
           <input type="date" id="fechaVencimiento" formControlName="fechaVencimiento">
         </div>
   
         <div class="form-group">
           <label for="imagen">Imagen (opcional):</label>
           <input type="file" id="imagen" (change)="onArchivoSeleccionado($event)">
         </div>
   
         <div class="form-buttons">
           <button type="submit" class="primary-button">{{ editando ? 'Actualizar' : 'Crear' }}</button>
           <button type="button" class="secondary-button" (click)="resetFormulario()" *ngIf="editando">Cancelar</button>
         </div>
       </form>
     </div>
    </div>
     </app-modal>
</div>
   <button class="edit-button" (click)="openForm()"> Crear Tarea</button>
 
  <hr class="divider">

  <h2>Listado de Tareas</h2>
  <div class="table-container">
    <table class="task-table">
      <thead>
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Prioridad</th>
          <th>Vencimiento</th>
          <th>Acciones</th>
          <th>imagen</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tarea of tareas">
          <td>{{ tarea.titulo }}</td>
          <td>{{ tarea.descripcion }}</td>
          <td>
            <span [ngClass]="{'priority-high': tarea.prioridad === 'alta',
                               'priority-medium': tarea.prioridad === 'media',
                               'priority-low': tarea.prioridad === 'baja'}">{{ tarea.prioridad | titlecase }}</span>
          </td>
          <td>{{ tarea.fechaVencimiento | date:'yyyy-MM-dd' }}</td>
          <td>{{ tarea.imagen }}</td>
          <td class="actions">
            <button class="edit-button" (click)="editarTarea(tarea)" (click)="openForm()">Editar</button>
            <button class="delete-button" (click)="eliminarTarea(tarea._id!)" (click)="openForm()">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
