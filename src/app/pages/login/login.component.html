
<div class="main-container">
    <app-navbar></app-navbar>
    <div class="main-section">
        <div class="login">
            <h1>Login</h1>
            <form [formGroup]="loginForm" (ngSubmit)="login()" >
           
                <input type="email" id="correoElectronico" formControlName="correoElectronico" placeholder="Username">
                <div *ngIf="loginForm.get('correoElectronico')?.invalid && loginForm.get('correoElectronico')?.touched">
                    <div *ngIf="loginForm.get('correoElectronico')?.errors?.['required']" class="error-message">Correo electrónico es requerido.</div>
                    <div *ngIf="loginForm.get('correoElectronico')?.errors?.['email']" class="error-message">Correo electrónico no válido.</div>
                  </div>
                <input type="password" name="p" placeholder="Password"  formControlName="contrasena" >
                <div *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched" class="error-message">
                  Contraseña es requerida.
                </div>
            
                <button type="submit" class="btn btn-primary btn-block btn-large"  [disabled]="loginForm.invalid">Ingresar</button>
                <div  class="btn btn-primary btn-block btn-large" (click)="openModal()">registro</div>
            </form>

    

        </div>
        <app-modal #AbriModal id="registro-modal">
            <div class="main-cont">
                <div class="login">
                  <h1>Registro</h1>
                  <form [formGroup]="registroForm" (ngSubmit)="registre()">
                    <input type="text" formControlName="nombre" placeholder="Nombres" required="required" />
                    <div *ngIf="registroForm.get('nombre')?.invalid && registroForm.get('nombre')?.touched" class="error-message">Nombre es requerido.</div>
          
                    <input type="text" formControlName="apellidos" placeholder="Apellidos" required="required" />
                    <div *ngIf="registroForm.get('apellidos')?.invalid && registroForm.get('apellidos')?.touched" class="error-message">Apellidos son requeridos.</div>
          
                    <input type="email" formControlName="correoElectronico" placeholder="Correo" required="required" />
                    <div *ngIf="registroForm.get('correoElectronico')?.invalid && registroForm.get('correoElectronico')?.touched">
                      <div *ngIf="registroForm.get('correoElectronico')?.errors?.['required']">Correo electrónico es requerido.</div>
                      <div *ngIf="registroForm.get('correoElectronico')?.errors?.['email']">Correo electrónico no válido.</div>
                    </div>
          
                    <input type="password" formControlName="contrasena" placeholder="Password" required="required" />
                    <div *ngIf="registroForm.get('contrasena')?.invalid && registroForm.get('contrasena')?.touched" class="error-message">Contraseña es requerida.</div>
          
                    <button class="btn btn-primary btn-block btn-large" type="submit" [disabled]="registroForm.invalid">Guardar</button>
                  </form>
                </div>
              </div>
         </app-modal>
    </div>

</div>
